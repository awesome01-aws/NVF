      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <circle cx="50" cy="50" r="44" stroke="#a7f3d0" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 2" fill="none" />
  
  <!-- Egg Shape -->
  <path
    d="M 50 16 C 32 16, 22 42, 22 64 C 22 78, 34 88, 50 88 C 66 88, 78 78, 78 64 C 78 42, 68 16, 50 16 Z"
